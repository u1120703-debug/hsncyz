<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>花小錢遊日本 - 浮世繪風格旅遊誌</title>
    <style>
        /* 和風浮世繪基礎樣式 */
        :root {
            --jp-red: #c0392b;
            --jp-indigo: #1b263b;
            --jp-beige: #f9f6f0;
            --jp-gold: #d4af37;
            --jp-border: #4a4a4a;
        }
        body {
            background-color: var(--jp-beige);
            color: #2b2b2b;
            font-family: "PingFang TC", "Heiti TC", "Microsoft JhengHei", sans-serif;
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }
        header {
            background: var(--jp-indigo);
            color: #fff;
            padding: 20px 15px;
            text-align: center;
            border-bottom: 5px solid var(--jp-gold);
            position: relative;
        }
        h1 { margin: 0; font-size: 28px; letter-spacing: 2px; }
        .site-desc { font-size: 14px; color: #ddd; margin-top: 5px; }

        /* 站長管理工具列 */
        #adminBar {
            background: #2d3436;
            color: #fff;
            padding: 8px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
        }
        .btn {
            background: var(--jp-red);
            color: #fff;
            border: none;
            padding: 6px 14px;
            cursor: pointer;
            border-radius: 4px;
            font-size: 13px;
        }
        .btn-green { background: #27ae60; }
        .btn-blue { background: #2980b9; }

        /* 歡迎區域與娃娃 */
        .welcome-box {
            background: #e8f4f8;
            border: 2px dashed #2980b9;
            border-radius: 8px;
            padding: 20px;
            margin: 20px auto;
            max-width: 900px;
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .mascot-wrap {
            width: 100px;
            height: 100px;
            flex-shrink: 0;
        }
        .mascot-avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 4px solid #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }

        /* 台灣 22 縣市獨立地圖區 */
        .map-section {
            max-width: 900px;
            margin: 20px auto;
            padding: 15px;
            background: #fff;
            border: 2px solid var(--jp-border);
            border-radius: 8px;
        }
        .region-title {
            font-size: 16px;
            font-weight: bold;
            color: var(--jp-indigo);
            margin-top: 10px;
            margin-bottom: 6px;
            border-bottom: 2px solid var(--jp-gold);
            display: inline-block;
        }
        .city-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 12px;
        }
        .city-btn {
            background: #ecf0f1;
            border: 1px solid #bdc3c7;
            padding: 5px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }
        .city-btn:hover {
            background: var(--jp-red);
            color: #fff;
            border-color: var(--jp-red);
        }

        /* 文章清單 */
        .post-list {
            max-width: 900px;
            margin: 20px auto;
            padding: 0 15px;
        }
        .post-card {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .post-title { font-size: 18px; color: var(--jp-indigo); margin: 0 0 8px 0; }
        .post-meta { font-size: 12px; color: #888; margin-bottom: 10px; }

        /* 設定視窗彈窗 */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
        .modal-content {
            background: #fff;
            width: 90%;
            max-width: 500px;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 13px; }
        .form-group input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    </style>
</head>
<body>

    <header>
        <h1 id="siteTitle">花小錢遊日本</h1>
        <div class="site-desc">浮世繪風旅遊情報・台灣 22 縣市探索・日本深度漫遊</div>
    </header>

    <div id="adminBar">
        <div>站長控制中心</div>
        <div>
            <button class="btn btn-green" onclick="openSyncModal()">⚡ GitHub 自動發布設定</button>
            <button class="btn btn-blue" onclick="openWriteModal()">✍️ 寫新文章</button>
        </div>
    </div>

    <!-- 首頁歡迎框與動態娃娃 -->
    <div class="welcome-box">
        <div class="mascot-wrap">
            <div class="mascot-avatar">🎎</div>
        </div>
        <div>
            <h3 style="margin:0 0 5px 0;">歡迎來到【花小錢遊日本＆台灣】！</h3>
            <p style="margin:0; font-size:14px; color:#555;">點選下方台灣縣市按鈕或日本區域，快速探索私房景點與實用攻略！</p>
        </div>
    </div>

    <!-- 台灣 22 縣市獨立按鈕區 -->
    <div class="map-section">
        <h3 style="margin-top:0;">🇹🇼 花小錢遊台灣 - 22 縣市快速導覽</h3>
        <div class="region-title">北部</div>
        <div class="city-group">
            <button class="city-btn" onclick="filterCity('基隆市')">基隆市</button>
            <button class="city-btn" onclick="filterCity('臺北市')">臺北市</button>
            <button class="city-btn" onclick="filterCity('新北市')">新北市</button>
            <button class="city-btn" onclick="filterCity('桃園市')">桃園市</button>
            <button class="city-btn" onclick="filterCity('新竹市')">新竹市</button>
            <button class="city-btn" onclick="filterCity('新竹縣')">新竹縣</button>
            <button class="city-btn" onclick="filterCity('宜蘭縣')">宜蘭縣</button>
        </div>
        <div class="region-title">中部</div>
        <div class="city-group">
            <button class="city-btn" onclick="filterCity('苗栗縣')">苗栗縣</button>
            <button class="city-btn" onclick="filterCity('臺中市')">臺中市</button>
            <button class="city-btn" onclick="filterCity('彰化縣')">彰化縣</button>
            <button class="city-btn" onclick="filterCity('南投縣')">南投縣</button>
            <button class="city-btn" onclick="filterCity('雲林縣')">雲林縣</button>
        </div>
        <div class="region-title">南部</div>
        <div class="city-group">
            <button class="city-btn" onclick="filterCity('嘉義市')">嘉義市</button>
            <button class="city-btn" onclick="filterCity('嘉義縣')">嘉義縣</button>
            <button class="city-btn" onclick="filterCity('臺南市')">臺南市</button>
            <button class="city-btn" onclick="filterCity('高雄市')">高雄市</button>
            <button class="city-btn" onclick="filterCity('屏東縣')">屏東縣</button>
        </div>
        <div class="region-title">東部與離島</div>
        <div class="city-group">
            <button class="city-btn" onclick="filterCity('花蓮縣')">花蓮縣</button>
            <button class="city-btn" onclick="filterCity('臺東縣')">臺東縣</button>
            <button class="city-btn" onclick="filterCity('澎湖縣')">澎湖縣</button>
            <button class="city-btn" onclick="filterCity('金門縣')">金門縣</button>
            <button class="city-btn" onclick="filterCity('連江縣(馬祖)')">連江縣</button>
        </div>
    </div>

    <!-- 文章呈現區 -->
    <div class="post-list" id="postContainer"></div>

    <!-- GitHub 同步設定視窗 -->
    <div class="modal" id="syncModal">
        <div class="modal-content">
            <h3>⚡ GitHub 直連自動同步設定</h3>
            <p style="font-size:12px; color:#666;">填寫一次後，每次按「發布文章」就會自動把文章存上伺服器，15 秒內全球生效！</p>
            <div class="form-group">
                <label>GitHub 帳號名稱 (Owner)</label>
                <input type="text" id="ghOwner" placeholder="例如: u1120703-debug">
            </div>
            <div class="form-group">
                <label>GitHub 儲存庫名稱 (Repo)</label>
                <input type="text" id="ghRepo" placeholder="例如: hsncyz">
            </div>
            <div class="form-group">
                <label>GitHub Personal Access Token (Classic)</label>
                <input type="password" id="ghToken" placeholder="ghp_...">
            </div>
            <div style="text-align: right;">
                <button class="btn" style="background:#888;" onclick="closeModal('syncModal')">取消</button>
                <button class="btn btn-green" onclick="saveGithubConfig()">💾 儲存設定</button>
            </div>
        </div>
    </div>

    <!-- 寫文章視窗 -->
    <div class="modal" id="writeModal">
        <div class="modal-content">
            <h3>✍️ 發表新文章</h3>
            <div class="form-group">
                <label>文章標題</label>
                <input type="text" id="postTitleInput">
            </div>
            <div class="form-group">
                <label>分類 / 地區</label>
                <input type="text" id="postCategoryInput" placeholder="例如: 高雄市 或 北海道">
            </div>
            <div class="form-group">
                <label>內文</label>
                <textarea id="postContentInput" style="width:100%; height:120px; border:1px solid #ccc; border-radius:4px; padding:8px;"></textarea>
            </div>
            <div style="text-align: right;">
                <button class="btn" style="background:#888;" onclick="closeModal('writeModal')">取消</button>
                <button class="btn btn-blue" id="publishBtn" onclick="publishAndSync()">🚀 立即發布並同步至全網</button>
            </div>
        </div>
    </div>

    <script id="siteData">
        // 內嵌式資料庫：直接跟著 HTML 走，最穩定絕不遺失
        window.ARTICLES = [
            {
                id: 1,
                title: "【花小錢遊日本】浮世繪美學與鐵道紀行",
                category: "北海道",
                date: "2026-10-15",
                content: "歡迎來到花小錢遊日本！這裡記錄了所有高 CP 值的旅行攻略與私房景點。"
            }
        ];
    </script>

    <script>
        // 渲染文章
        function renderArticles(list) {
            const container = document.getElementById('postContainer');
            if (!list || list.length === 0) {
                container.innerHTML = '<div style="text-align:center; padding:30px; color:#888;">目前沒有此分類的文章。</div>';
                return;
            }
            container.innerHTML = list.map(item => `
                <div class="post-card">
                    <h2 class="post-title">${item.title}</h2>
                    <div class="post-meta">發布日期：${item.date} ｜ 地區：${item.category}</div>
                    <div>${item.content}</div>
                </div>
            `).join('');
        }

        // 分類篩選
        function filterCity(cityName) {
            const filtered = window.ARTICLES.filter(a => a.category.includes(cityName));
            renderArticles(filtered);
        }

        // 彈窗開關
        function openSyncModal() {
            document.getElementById('ghOwner').value = localStorage.getItem('gh_owner') || 'u1120703-debug';
            document.getElementById('ghRepo').value = localStorage.getItem('gh_repo') || 'hsncyz';
            document.getElementById('ghToken').value = localStorage.getItem('gh_token') || '';
            document.getElementById('syncModal').style.display = 'flex';
        }
        function openWriteModal() {
            document.getElementById('writeModal').style.display = 'flex';
        }
        function closeModal(id) {
            document.getElementById(id).style.display = 'none';
        }

        // 儲存 GitHub 設定
        function saveGithubConfig() {
            const owner = document.getElementById('ghOwner').value.trim();
            const repo = document.getElementById('ghRepo').value.trim();
            const token = document.getElementById('ghToken').value.trim();
            if (!owner || !repo || !token) {
                alert('請完整填寫 3 個欄位！');
                return;
            }
            localStorage.setItem('gh_owner', owner);
            localStorage.setItem('gh_repo', repo);
            localStorage.setItem('gh_token', token);
            alert('✅ GitHub 連線設定已儲存！往後發布文章將自動推送至雲端！');
            closeModal('syncModal');
        }

        // 發布文章並直接透過 GitHub API 寫入
        async function publishAndSync() {
            const title = document.getElementById('postTitleInput').value.trim();
            const category = document.getElementById('postCategoryInput').value.trim();
            const content = document.getElementById('postContentInput').value.trim();

            if (!title || !content) {
                alert('請填寫標題與內容！');
                return;
            }

            const owner = localStorage.getItem('gh_owner');
            const repo = localStorage.getItem('gh_repo');
            const token = localStorage.getItem('gh_token');

            if (!owner || !repo || !token) {
                alert('尚未設定 GitHub Token！請先點擊「⚡ GitHub 自動發布設定」進行綁定。');
                return;
            }

            const publishBtn = document.getElementById('publishBtn');
            publishBtn.innerText = '⏳ 正在自動推送發布至全網...';
            publishBtn.disabled = true;

            // 新增文章
            const newArticle = {
                id: Date.now(),
                title: title,
                category: category || '其他',
                date: new Date().toISOString().split('T')[0],
                content: content
            };
            window.ARTICLES.unshift(newArticle);

            try {
                // 1. 取得目前 GitHub 上的 index.html 的 SHA
                const getUrl = `https://api.github.com/repos/${owner}/${repo}/contents/index.html`;
                const getRes = await fetch(getUrl, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (!getRes.ok) throw new Error('讀取 GitHub 檔案失敗，請檢查 Token 與儲存庫權限');
                const fileData = await getRes.json();
                const sha = fileData.sha;

                // 2. 替換文章資料並產生新 HTML
                let currentHtml = document.documentElement.outerHTML;
                const newContentBase64 = btoa(unescape(encodeURIComponent('<!DOCTYPE html>\n' + currentHtml)));

                // 3. 推送更新至 GitHub
                const putRes = await fetch(getUrl, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: `發布新文章: ${title}`,
                        content: newContentBase64,
                        sha: sha
                    })
                });

                if (!putRes.ok) throw new Error('推送新內容失敗，請確認 Token 具備 repo 寫入權限');

                alert('🎉 發布成功！文章已自動推送到 GitHub！\nCloudflare 正自動同步更新，約 15 秒後用手機重新整理即可看到！');
                closeModal('writeModal');
                renderArticles(window.ARTICLES);
            } catch (err) {
                alert('❌ 同步失敗：' + err.message);
            } finally {
                publishBtn.innerText = '🚀 立即發布並同步至全網';
                publishBtn.disabled = false;
            }
        }

        // 初始化
        window.onload = function() {
            renderArticles(window.ARTICLES);
        };
    </script>
</body>
</html>
